<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emotion Detection & Content Recommendation</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    /* --- Reset & Base Styles --- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        color: #fff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }
    a { text-decoration: none; color: inherit; }

    /* --- Container --- */
    .container {
        max-width: 900px;
        margin: 50px auto 0;
        text-align: center;
        padding: 20px;
    }
    h1 {
        font-size: 2.8rem;
        font-weight: 700;
        background: linear-gradient(90deg, #ff6ec4, #7873f5);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 40px;
        animation: glowText 2s infinite alternate;
    }
    @keyframes glowText {
        0% { text-shadow: 0 0 5px #ff6ec4, 0 0 10px #7873f5; }
        100% { text-shadow: 0 0 20px #ff6ec4, 0 0 30px #7873f5; }
    }

    /* --- Video Card --- */
    #video-container {
        position: relative;
        width: 100%;
        max-width: 700px;
        margin: 0 auto;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        background: rgba(255,255,255,0.05);
        border: 2px solid rgba(255,255,255,0.1);
    }

    #video-feed {
        width: 100%;
        display: block;
        border-radius: 20px;
        filter: brightness(1.1);
    }

    /* --- Emotion Label --- */
    #emotion-label {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: linear-gradient(90deg, #ff6ec4, #7873f5);
        padding: 15px 30px;
        border-radius: 50px;
        font-size: 1.5rem;
        font-weight: 600;
        color: #fff;
        text-shadow: 0 0 10px rgba(0,0,0,0.5);
        animation: pulse 2s infinite;
        box-shadow: 0 0 20px rgba(255,110,196,0.6), 0 0 30px rgba(120,115,245,0.6);
    }

    @keyframes pulse {
        0% { transform: translateX(-50%) scale(1); }
        50% { transform: translateX(-50%) scale(1.05); }
        100% { transform: translateX(-50%) scale(1); }
    }

    /* --- Footer --- */
    footer {
        text-align: center;
        padding: 20px;
        background: rgba(0,0,0,0.3);
        font-size: 0.9rem;
        letter-spacing: 1px;
    }
    footer p { color: #fff; }

    /* --- Optional Neon Glow for Emotion Text --- */
    #emotion-text {
        text-transform: uppercase;
        letter-spacing: 1.5px;
        animation: neonGlow 1.5s ease-in-out infinite alternate;
    }
    @keyframes neonGlow {
        0% { text-shadow: 0 0 5px #ff6ec4, 0 0 10px #7873f5; }
        100% { text-shadow: 0 0 20px #ff6ec4, 0 0 40px #7873f5; }
    }
</style>
</head>
<body>

<div class="container">
    <h1>Emotion-Based Content Recommendation</h1>

    <div id="video-container">
        <img id="video-feed" src="{{ url_for('video_feed') }}" alt="Webcam Feed">
        <div id="emotion-label">
            Detected Emotion: <span id="emotion-text">HAPPY</span>
        </div>
    </div>
</div>

<footer>
    <p>Developed by Kazi Mahathir</p>
</footer>

<script>
    // Example: dynamically update emotion
    const emotions = ["Happy", "Sad", "Angry", "Surprised", "Neutral"];
    const emotionText = document.getElementById("emotion-text");

    // Simulate emotion change every 3 seconds
    setInterval(() => {
        const randomEmotion = emotions[Math.floor(Math.random() * emotions.length)];
        emotionText.innerText = randomEmotion.toUpperCase();
    }, 3000);
</script>

</body>
</html>
